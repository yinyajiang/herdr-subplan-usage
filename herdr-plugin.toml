id = "herdr-subplan-usage"
name = "Subscription Usage"
version = "0.7.1"
min_herdr_version = "0.9.0"
description = "Zhipu CN, Kimi CN, Codex and Cursor subscription usage"
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["python3", "main.py", "start"]

[[actions]]
id = "init-config"
title = "Create subscription usage configuration"
contexts = ["workspace"]
command = ["python3", "main.py", "init-config"]

[[actions]]
id = "refresh"
title = "Refresh subscription usage"
contexts = ["workspace"]
command = ["python3", "main.py", "refresh"]

[[actions]]
id = "start"
title = "Start subscription usage updates"
contexts = ["workspace"]
command = ["python3", "main.py", "start"]

[[actions]]
id = "show"
title = "Show subscription usage"
contexts = ["workspace"]
command = ["python3", "main.py", "show"]

[[actions]]
id = "stop"
title = "Stop subscription usage updates"
contexts = ["workspace"]
command = ["python3", "main.py", "stop"]

[[events]]
on = "tab.focused"
command = ["python3", "main.py", "ensure"]

[[events]]
on = "workspace.focused"
command = ["python3", "main.py", "ensure"]

[[panes]]
id = "usage"
title = "订阅用量"
placement = "popup"
width = 52
height = "85%"
command = ["python3", "main.py", "popup-view"]
